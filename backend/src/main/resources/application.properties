spring.application.name=gpx-manager

# Where the app keeps its own data (SQLite). In the container this is the named volume.
gpx.data-dir=${GPX_DATA_DIR:./data}
# The Library: the folder of GPX Files. In the container this is the bind mount; its host path is set in .env.
gpx.library-path=${GPX_LIBRARY_PATH:./library}

spring.datasource.url=jdbc:sqlite:${gpx.data-dir}/gpx-manager.db

# Plain HTTP on 8080 for local development (Vite proxies /api here).
# The container switches to HTTPS on 8443 through environment variables (see compose.yaml).
server.port=8080
